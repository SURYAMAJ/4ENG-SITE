@font-face{font-family:"Archivo";src:url(/assets/fonts/archivo-var.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}

:root{--paper:#EEF2F1;--ink:#142230;--ink-2:#4B5B69;--cad:#1F5FD6;--rule:#BFCBCE;color-scheme:light}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Archivo",Arial,sans-serif;padding:24px}
main{max-width:560px;border:1.5px solid var(--ink);padding:32px;display:grid;gap:16px}
.tag{font-family:"B612",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font-size:clamp(2rem,6vw,3rem);font-stretch:115%;font-weight:760;line-height:1}
p{margin:0;color:var(--ink-2)}
a{display:inline-block;justify-self:start;background:var(--cad);color:#fff;text-decoration:none;font-weight:600;padding:12px 16px;border-radius:3px}
</style>
</head>
<body>
<main>
  <span class="tag">Sheet not found / Rev —</span>
